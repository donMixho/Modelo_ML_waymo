# This is a boilerplate parameters config generated for pipeline 'eda'
# using Kedro 1.3.1.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.3.1/configuration/parameters.html

eda:
  raw_data_path: data/01_raw/detecciones_waymo_like.csv
  categorical_audit_columns:
    - object_type
    - weather
    - time_of_day
    - detection_difficulty
    - sensor_version
  target_candidates:
    - detection_difficulty
    - object_type
  crosstab_variables:
    - weather
    - time_of_day
    - object_type
  iqr_multiplier: 1.5
  zscore_threshold: 3.0
  signal_check:
    random_state: 42
    test_size: 0.3
    tree_max_depth: 5
    mi_noise_multiplier: 2.0
    macro_f1_lift_signal: 0.05
    macro_f1_lift_weak: 0.01
    alpha: 0.05
